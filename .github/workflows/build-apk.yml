name: Build Skate 3 Android 11 APK

on:
  push:
    branches:
      - Android-11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skate3-android11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    # The repository's native code-generation preset is macOS ARM64-only.
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Check out Android-11 branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.31.6"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Verify required private game data
        run: |
          if [ ! -f game/default.xex ] || [ ! -f game/data/webkit/EAWebkit.xex ]; then
            echo "::error::Cannot build a playable APK: required Skate 3 game data is not present."
            echo "The game files are not included in this repository. Provide your own legally obtained game dump to the runner through a private, secure setup before building."
            exit 1
          fi

      - name: Install native build tools
        run: |
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build native ARM64 libraries
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          chmod +x android/tools/build_android_libs.sh
          ./android/tools/build_android_libs.sh

      - name: Build Android APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skate3-Android-11-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
