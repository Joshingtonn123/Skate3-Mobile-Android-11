name: Build Skate 3 Android 11 APK

# Native recompilation requires a private, legally obtained game dump at build
# time. Run this workflow manually when the game-data secrets are configured.
on:
  workflow_dispatch:
    inputs:

permissions:
  contents: read

concurrency:
  group: skate3-android11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    # Native code generation requires an ARM64 macOS runner.
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Check out Android-11 branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify ARM64 runner
        run: |
          echo "Runner architecture: $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::This repository's native code-generation preset requires an ARM64 macOS runner."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # Keep game data out of Git. Configure these as repository Actions secrets.
      # The URLs must point to private downloads accessible to the runner.
      - name: Check private game download secrets
        env:
          GAME_ISO_URL: ${{ secrets.SKATE3_GAME_ISO_URL }}
          TITLE_UPDATE_URL: ${{ secrets.SKATE3_TITLE_UPDATE_URL }}
        run: |
          if [ -z "$GAME_ISO_URL" ]; then
            echo "::error::Add repository secret SKATE3_GAME_ISO_URL for your own legally obtained Skate 3 Xbox 360 ISO."
            exit 1
          fi
          if [ -z "$TITLE_UPDATE_URL" ]; then
            echo "::error::Add repository secret SKATE3_TITLE_UPDATE_URL pointing to the required Skate 3 Title Update 3 package."
            exit 1
          fi

      - name: Install ISO extraction tool
        run: |
          git clone --depth 1 https://github.com/xboxdev/extract-xiso.git "$RUNNER_TEMP/extract-xiso"
          cmake -S "$RUNNER_TEMP/extract-xiso" -B "$RUNNER_TEMP/extract-xiso/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/extract-xiso/build" --parallel
          echo "$RUNNER_TEMP/extract-xiso/build" >> "$GITHUB_PATH"

      - name: Download and extract the private Skate 3 ISO
        env:
          GAME_ISO_URL: ${{ secrets.SKATE3_GAME_ISO_URL }}
        run: |
          set -euo pipefail
          mkdir -p game
          curl --fail --location --silent --show-error --retry 3 "$GAME_ISO_URL" --output "$RUNNER_TEMP/skate3.iso"
          test -s "$RUNNER_TEMP/skate3.iso"
          mkdir -p "$RUNNER_TEMP/skate3-extracted"
          extract-xiso -x "$RUNNER_TEMP/skate3.iso" -d "$RUNNER_TEMP/skate3-extracted"
          default_xex="$(find "$RUNNER_TEMP/skate3-extracted" -type f -name default.xex -print -quit)"
          if [ -z "$default_xex" ]; then
            echo "::error::No default.xex was found in the selected ISO."
            exit 1
          fi
          game_root="$(dirname "$default_xex")"
          if [ ! -f "$game_root/data/webkit/EAWebkit.xex" ]; then
            echo "::error::The ISO is missing data/webkit/EAWebkit.xex."
            exit 1
          fi
          ditto "$game_root" game
          test -s game/default.xex
          test -s game/data/webkit/EAWebkit.xex

      - name: Download Title Update 3 package
        env:
          TITLE_UPDATE_URL: ${{ secrets.SKATE3_TITLE_UPDATE_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$TITLE_UPDATE_URL"             --output "$RUNNER_TEMP/TU_12K2276_000000C000000.00000000000O3"
          test -s "$RUNNER_TEMP/TU_12K2276_000000C000000.00000000000O3"
          cp "$RUNNER_TEMP/TU_12K2276_000000C000000.00000000000O3"             "$GITHUB_WORKSPACE/TU_12K2276_000000C000000.00000000000O3"

      - name: Install native build tools
        run: |
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build native ARM64 libraries
        env:
          SKATE3_GAME_DATA_ROOT: ${{ github.workspace }}/game
          SKATE3_TITLE_UPDATE_PACKAGE: ${{ github.workspace }}/TU_12K2276_000000C000000.00000000000O3
        run: |
          chmod +x android/tools/build_android_libs.sh
          ./android/tools/build_android_libs.sh

      - name: Build Android APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skate3-Android-11-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
